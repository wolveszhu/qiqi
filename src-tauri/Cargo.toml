[package]
name = "七七"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qiqi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# C2 桌面融合：全局快捷键、开机自启（均仅 Rust 侧使用，无 JS 权限条目）
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# C2 探针：Win32 GetCursorPos（系统能力一律 Rust 侧，rule.md §5）
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Threading"] }
# C4 对话管道：异步运行时（Tauri async_runtime 即 tokio）+ OpenAI 兼容 HTTP/SSE
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }  # C5 衰减结算的本地日期/天数差

rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "blob"] }
sqlite-vec = "0.1"
rusqlite_migration = "1" # 有序迁移链，内部以 PRAGMA user_version 管版本（禁止手工覆写）
keyring = { version = "3", features = ["windows-native"] } # Windows 凭据管理器：SQLCipher 密钥存取（必须显式启用平台后端，3.x 无默认后端）
getrandom = "0.2"       # 32 字节随机密钥生成

[dev-dependencies]
tempfile = "3"          # 数据层集成测试：临时 db 目录，不动用户数据


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# F1.4：代码质量门禁（lint-rules §5 建议项）。
# 设为 warn；CI/DoD 以 `cargo clippy --all-targets -- -D warnings` 收口零告警。
# 存量 unwrap/expect/panic/indexing 逐条改造为 AppError 或在确需保留处 `#[allow]` 加理由（见各文件）。
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
