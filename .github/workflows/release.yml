name: Release

# 触发：推送 v* tag（如 v0.1.0）自动打包并发布到 GitHub Release；
# 也支持在 Actions 页面手动触发（workflow_dispatch）便于调试。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action 需要用默认 GITHUB_TOKEN 创建/更新 Release。
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # Windows runner 预装 WiX / NSIS / WebView2，可直接产出 msi 与 nsis 安装包。
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        # 与本地 pnpm 12.x 保持一致，避免 lockfile 校验失败。
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 显式先构建一次前端，让静态守卫能扫描即将嵌入二进制的 dist/。
      # tauri-action 内部还会按 beforeBuildCommand 再跑一次 pnpm build（幂等）。
      - name: Build frontend for artifact scan
        run: pnpm build

      # 发布数据防线 1/2：构建输入不得含数据文件 / 测试种子 / 明文凭据。
      # 见 src-tauri/src/db/README.md §7.3；失败即中止，不产出 Release。
      - name: Verify release data (static guard)
        run: pnpm verify:release-data

      # 发布数据防线 2/2：干净空库跑完 M1–M11，断言仅含系统基础数据。
      # 该步骤会编译 qiqi_lib（触发 build.rs 读取编译期凭据），故与打包步骤注入同一组 secrets，
      # 保证守卫看到的基线与实际发布产物一致；缺失时 option_env! 降级为「内置通道未配置」。
      - name: Verify clean-install data baseline
        working-directory: src-tauri
        env:
          # 全部内置共享凭据（与 .env.example / build.rs 清单一致）；迁移 SQL 只留空占位，
          # 守卫必须与打包产物看到同一组注入值，否则基线断言会与实际发布包不一致。
          QIQI_ZHIPU_API_KEY: ${{ secrets.QIQI_ZHIPU_API_KEY }}
          QIQI_SILICONFLOW_API_KEY: ${{ secrets.QIQI_SILICONFLOW_API_KEY }}
          QIQI_BAIDU_APPID: ${{ secrets.QIQI_BAIDU_APPID }}
          QIQI_BAIDU_SECRET: ${{ secrets.QIQI_BAIDU_SECRET }}
          QIQI_XFYUN_APPID: ${{ secrets.QIQI_XFYUN_APPID }}
          QIQI_XFYUN_API_SECRET: ${{ secrets.QIQI_XFYUN_API_SECRET }}
          QIQI_XFYUN_API_KEY: ${{ secrets.QIQI_XFYUN_API_KEY }}
        run: cargo test --test release_data_guard

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # 自动发布 Release 所需的令牌（仓库自带，无需手动配置 secret）。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 内置共享凭据：仅存在于 Actions secrets，明文不进仓库 / 迁移 SQL / 前端产物。
          QIQI_ZHIPU_API_KEY: ${{ secrets.QIQI_ZHIPU_API_KEY }}
          QIQI_SILICONFLOW_API_KEY: ${{ secrets.QIQI_SILICONFLOW_API_KEY }}
          QIQI_BAIDU_APPID: ${{ secrets.QIQI_BAIDU_APPID }}
          QIQI_BAIDU_SECRET: ${{ secrets.QIQI_BAIDU_SECRET }}
          QIQI_XFYUN_APPID: ${{ secrets.QIQI_XFYUN_APPID }}
          QIQI_XFYUN_API_SECRET: ${{ secrets.QIQI_XFYUN_API_SECRET }}
          QIQI_XFYUN_API_KEY: ${{ secrets.QIQI_XFYUN_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Qiqi ${{ github.ref_name }}"
          releaseBody: |
            桌面桌宠「七七」自动构建安装包（MSI + NSIS）。

            - `qiqi_*`_x64_en-US.msi`：系统级安装/卸载
            - `qiqi_*`_x64_en-US.nsis.exe`：绿色安装向导

            系统要求：Windows 10 / 11，且已安装 WebView2 运行时（Windows 11 自带；
            Windows 10 首次运行会引导安装）。未签名安装包在 SmartScreen 下可能提示，
            选择「仍要运行」即可。
          releaseDraft: true
          prerelease: false
