# ============================================================
# 七七官网 · qiqi.bootai.work
# 部署方式二：自有 Nginx + HTTPS（Let's Encrypt / certbot）
# ------------------------------------------------------------
# 用法：
#   1) 将 website/.vitepress/dist 的全部内容上传到站点根目录（如下方 /var/www/qiqi）
#   2) sudo cp qiqi.bootai.work.conf /etc/nginx/sites-available/
#   3) sudo ln -s /etc/nginx/sites-available/qiqi.bootai.work.conf /etc/nginx/sites-enabled/
#   4) 先申请证书（见下方「证书引导」），再 sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---------- 端口 80：仅用于证书校验 + 全站跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name qiqi.bootai.work;

    # certbot 申请/续期时写入校验文件，80 端口需保留此路径
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # 其余请求 301 跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 端口 443：HTTPS 站点 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                         # nginx < 1.25.1 时改为：listen 443 ssl http2;
    server_name qiqi.bootai.work;

    root /var/www/qiqi;               # 上传 dist/ 内容的目录
    index index.html;

    # --- TLS 证书（certbot 默认路径，申请后生效） ---
    ssl_certificate     /etc/nginx/ssl/qiqi.bootai.work_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/qiqi.bootai.work.key;

    # 现代协议与加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP 装订（可选，开启需下方 resolver 与 ssl_trusted_certificate）
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/qiqi.bootai.work/chain.pem;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;

    # HSTS：确认全站稳定走 HTTPS 后保留；如需含子域改为 max-age=63072000; includeSubDomains
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- cleanUrls：/features -> /features.html，/en/ -> /en/index.html ---
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 带 hash 的静态资源：长缓存 + 不可变
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 禁止访问敏感隐藏文件（放行 .well-known 供证书校验）
    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}

# ============================================================
# 证书引导（certbot）：
#   首次部署时 443 server 引用的证书还不存在，nginx -t 会报错。
#   请先申请证书，再启用：
#
#   sudo apt install certbot  # 或对应系统的 certbot
#   sudo certbot certonly --webroot -w /var/www/qiqi -d qiqi.bootai.work
#
#   证书生成后：
#   sudo nginx -t && sudo systemctl reload nginx
#
#   自动续期（certbot 默认已装.timer；可测试）：
#   sudo certbot renew --dry-run
# ============================================================
